<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vAhyThe</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--fg:#0f172a;--muted:#64748b;--card:#fff;--line:#e2e8f0;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e2e8f0;--muted:#94a3b8;--card:#111827;--line:#1f2937;--accent:#60a5fa}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;margin:0 0 24px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;color:inherit;text-decoration:none;margin-bottom:12px}
a.card:hover{border-color:var(--accent)}
a.card b{color:var(--accent)}
a.card span{display:block;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>vAhyThe</h1>
<a class="card" href="jinudy/"><b>Jinudy – prohlížeč historie</b><span>Mapa prošlých ulic ze sdílené historie aplikace Jinudy. Ukázka: <code>jinudy/?demo</code></span></a>
</main>
</body>
</html>
