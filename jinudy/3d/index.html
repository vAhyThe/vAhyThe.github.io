    <!-- Only the page itself and the basemap of "Na mapě" (OpenFreeMap: style, tiles, sprites,
         fonts). The map worker is a file of the page; blob: is allowed for it as MapLibre's
         fallback. The data are generated in the page, nothing else is fetched or sent. -->

      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; img-src 'self' blob: data: https://tiles.openfreemap.org; connect-src 'self' blob: data: https://tiles.openfreemap.org; font-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
